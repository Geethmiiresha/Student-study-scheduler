<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome - Study Scheduler</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: linear-gradient(120deg, #fceabb, #f8b500);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .home-container {
      background-color: #ffffffdd;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 600px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 2.5em;
      color: #333;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 1.2em;
      margin-bottom: 30px;
    }

    .nav-btn {
      display: block;
      margin: 15px auto;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(45deg, #f9a825, #ffca28);
      color: white;
      text-decoration: none;
      width: 80%;
      max-width: 300px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(249, 168, 37, 0.4);
    }
  </style>
</head>
<body>
  <div class="home-container">
    <h1>Welcome to Study Scheduler</h1>
    <p>Organize your subjects, plan your hours, and visualize your study goals.</p>

    <a class="nav-btn" href="index.html">➕ Start Planning</a>
    <a class="nav-btn" href="chart.html">📊 View Study Chart</a>
    <a class="nav-btn" href="about.html">ℹ️ About This App</a>
  </div>
</body>
</html>
